name: Basic Checks

# Only run on pull requests to avoid blocking pushes to main
on:
  pull_request:
    branches: ['main', 'dev']

jobs:
  install-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check package.json exists
        run: test -f package.json && echo "✓ package.json exists"

      - name: Verify TypeScript is installed
        run: pnpm exec tsc --version

      - name: Info - Full build requires local setup
        run: |
          echo "✓ Dependencies installed successfully"
          echo ""
          echo "ℹ️  Full build and typecheck require:"
          echo "  - Database schema setup (pnpm db:push)"
          echo "  - i18n compilation (pnpm i18n:compile)"
          echo "  - Route generation (pnpm routes:generate)"
          echo ""
          echo "To test locally, run: pnpm build"
