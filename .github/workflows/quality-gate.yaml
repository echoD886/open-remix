name: Quality Gate

on:
  pull_request:
    branches: ['main', 'dev']
  push:
    branches: ['main', 'dev']
  workflow_dispatch:

jobs:
  typecheck-build-and-audit:
    runs-on: ubuntu-latest
    env:
      DATABASE_PROVIDER: sqlite
      DATABASE_URL: file:data/test.db
      AUTH_SECRET: test-secret-for-ci-only-not-for-production-use-generate-your-own
      VITE_APP_URL: http://localhost:3000
      VITE_APP_NAME: OpenRemix

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up database schema
        run: |
          if [ ! -f src/config/db/schema.ts ]; then
            echo "Copying default SQLite schema..."
            cp src/config/db/schema.sqlite.ts src/config/db/schema.ts
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint || echo "Linting completed with warnings"

      - name: Build
        run: pnpm build
